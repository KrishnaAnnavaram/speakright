[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speakright"
version = "0.1.0"
description = "AI pronunciation coach for English and Mandarin"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
recognizer = ["torch>=2.1", "transformers>=4.40"]
g2p = ["cmudict>=1.0", "pypinyin>=0.49"]
llm = ["httpx>=0.27"]
ui = ["streamlit>=1.39"]
all = ["speakright[recognizer,g2p,llm,ui]"]
dev = ["pytest>=8"]

[project.scripts]
speakright = "speakright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
